<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨资产宏观传导框架 · SUPER爱投资</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4;
  --surface-0:#FFFFFF;
  --surface-1:#F1ECE2;
  --border:#DCD5C6;
  --text-primary:#1A1A1A;
  --text-muted:#7A7466;
  --text-accent:#5B4636;
  --bg-accent:#EFE6D8;
  --text-warning:#8C4A2F;
  --bg-warning:#F5E6DC;
  --up:#3D6B4F;
  --bg-up:#E6EEE8;
  --down:#A13C2D;
  --bg-down:#F6E3DE;
  --neutral:#8A7F5E;
  --bg-neutral:#F1ECDD;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'DM Sans',-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  padding:28px 20px 60px;
  max-width:720px;
  margin:0 auto;
  -webkit-font-smoothing:antialiased;
}
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--text-accent);
  text-transform:uppercase;
  margin-bottom:10px;
}
h1{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:26px;
  line-height:1.25;
  margin-bottom:8px;
  color:var(--text-primary);
}
.subtitle{
  font-size:13.5px;
  color:var(--text-muted);
  margin-bottom:26px;
  line-height:1.6;
}
/* Tabs */
.tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:22px;
}
@media(min-width:520px){.tabs{grid-template-columns:repeat(3,1fr);}}
.tab{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:500;
  padding:12px 10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface-0);
  color:var(--text-muted);
  cursor:pointer;
  text-align:center;
  transition:all .15s ease;
  line-height:1.4;
}
.tab:hover{border-color:var(--text-accent);color:var(--text-primary);}
.tab.active{
  background:var(--text-primary);
  border-color:var(--text-primary);
  color:#FAF8F4;
  font-weight:600;
}
/* Content card */
#sc{margin-bottom:6px;}
.trigger-box{
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 18px;
  margin-bottom:18px;
  background:var(--surface-0);
}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.tag-driver{
  font-family:'DM Mono',monospace;
  font-size:11px;
  padding:3px 9px;
  border-radius:5px;
  font-weight:500;
  background:var(--bg-accent);
  color:var(--text-accent);
}
.tag-lag{
  font-family:'DM Mono',monospace;
  font-size:11px;
  padding:3px 9px;
  border-radius:5px;
  background:var(--surface-1);
  color:var(--text-muted);
  border:1px solid var(--border);
}
.trigger-text{
  font-size:14.5px;
  color:var(--text-primary);
  line-height:1.7;
}
.section-label{
  font-family:'DM Mono',monospace;
  font-size:10.5px;
  font-weight:500;
  color:var(--text-muted);
  margin-bottom:10px;
  letter-spacing:1px;
  text-transform:uppercase;
}
/* Chain */
.chain{margin-bottom:22px;}
.chain-step{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:10px 0;
  border-bottom:1px dashed var(--border);
}
.chain-step:last-child{border-bottom:none;}
.chain-num{
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--text-accent);
  background:var(--bg-accent);
  width:22px;height:22px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  margin-top:1px;
}
.chain-text{font-size:13.5px;line-height:1.6;color:var(--text-primary);}
/* Impact grid */
.igrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}
.icard{
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px 13px;
  background:var(--surface-0);
}
.icard-asset{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-primary);
  margin-bottom:5px;
}
.icard-dir{
  font-family:'DM Mono',monospace;
  font-size:11px;
  font-weight:500;
  padding:2px 7px;
  border-radius:4px;
  display:inline-block;
  margin-bottom:6px;
}
.dir-up{background:var(--bg-up);color:var(--up);}
.dir-down{background:var(--bg-down);color:var(--down);}
.dir-neutral{background:var(--bg-neutral);color:var(--neutral);}
.icard-note{font-size:12px;color:var(--text-muted);line-height:1.5;}
/* Insight box */
.ins{
  border-radius:10px;
  padding:15px 17px;
  border-left:3px solid var(--text-accent);
  background:var(--bg-accent);
  margin-bottom:6px;
}
.ins.trap{border-left-color:var(--text-warning);background:var(--bg-warning);}
.ins-label{font-size:11.5px;font-weight:600;margin-bottom:5px;}
.ins-text{font-size:13.5px;line-height:1.7;color:var(--text-primary);}
/* Matrix */
.matrix-wrap{margin-top:34px;}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:9px 8px;
  text-align:left;
  border-bottom:1px solid var(--border);
}
th{
  font-family:'DM Mono',monospace;
  font-size:10.5px;
  font-weight:500;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.5px;
}
td{color:var(--text-primary);}
td.dir-up{background:none;color:var(--up);font-weight:600;padding-left:8px;}
td.dir-down{background:none;color:var(--down);font-weight:600;padding-left:8px;}
td.dir-neutral{background:none;color:var(--neutral);font-weight:600;padding-left:8px;}
.matrix-row-active{background:var(--surface-1);}
footer{
  margin-top:40px;
  padding-top:16px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--text-muted);
  text-align:center;
  line-height:1.6;
}
</style>
</head>
<body>

<div class="eyebrow">Cross-Asset Macro Transmission</div>
<h1>跨资产宏观传导框架</h1>
<p class="subtitle">从宏观驱动事件出发，拆解传导链条、四类资产的方向性影响，以及容易被忽略的非共识洞察。点击情境切换。</p>

<div class="tabs" id="tabs"></div>
<div id="sc"></div>

<div class="matrix-wrap">
  <div class="section-label">快速参考矩阵</div>
  <table>
    <thead>
      <tr><th>情境</th><th>美元</th><th>美债收益率</th><th>黄金</th><th>股市</th></tr>
    </thead>
    <tbody id="matrix"></tbody>
  </table>
</div>

<footer>
  仅供学习交流，不构成投资建议 · SUPER爱投资
</footer>

<script>
const scenarios = {
  fed_hike: {
    label: '美联储加息',
    driver: '货币政策',
    lag: '即时 ~ 2季度',
    trigger: '美联储在议息会议上上调联邦基金利率目标区间，并释放偏鹰派前瞻指引，市场重新定价未来加息路径。',
    chain: [
      '短端利率上行，货币市场收益率同步抬升，融资成本增加',
      '美元实际利差扩大，吸引全球资本回流美元资产，美元指数走强',
      '高估值成长股折现率上升，估值压缩幅度大于盈利下修幅度',
      '新兴市场本币面临贬值压力，偿还美元债成本上升，资本外流风险抬头'
    ],
    impacts: [
      {asset:'美元指数', dir:'up', note:'短期偏强，利差逻辑主导'},
      {asset:'美债收益率', dir:'up', note:'短端上行更快，曲线可能趋平'},
      {asset:'黄金', dir:'down', note:'持有成本上升，短期承压'},
      {asset:'成长股/纳指', dir:'down', note:'久期最长，对利率最敏感'}
    ],
    insight:{type:'ins', label:'非共识洞察', text:'"加息=股市跌"并非线性关系。如果加息是因为经济数据强劲（而非单纯抗通胀），盈利上修可能部分抵消估值压缩——历史上多次加息周期股市仍上涨。真正的风险点在于"加息速度超出盈利消化能力"的临界点。'}
  },
  fed_cut: {
    label: '美联储降息',
    driver: '货币政策',
    lag: '即时 ~ 3季度',
    trigger: '美联储开启降息周期，无论是预防式降息还是应对经济走弱的被动降息，市场开始交易流动性宽松预期。',
    chain: [
      '短端利率下行，资金成本下降，风险偏好回升',
      '美元利差优势收窄，美元指数承压走弱',
      '长久期资产（成长股、长债）折现率下降，估值获得支撑',
      '新兴市场资本流入改善，本币压力缓解，套利交易重新活跃'
    ],
    impacts: [
      {asset:'美元指数', dir:'down', note:'利差收窄，资金分流海外'},
      {asset:'美债收益率', dir:'down', note:'短端领跌，曲线走陡'},
      {asset:'黄金', dir:'up', note:'实际利率下行，持有成本降低'},
      {asset:'成长股/纳指', dir:'up', note:'估值端受益最直接'}
    ],
    insight:{type:'trap', label:'陷阱提示', text:'"预防式降息"和"衰退式降息"的市场反应截然相反。前者往往是股市牛市延续的起点（1995年案例），后者往往伴随盈利大幅下修、股市继续下跌（2001年、2007年案例）。关键要看降息发生时经济数据和信用利差的状态，而不是降息本身。'}
  },
  yen_carry: {
    label: '日元套息崩解',
    driver: '汇率冲击',
    lag: '数日 ~ 数周',
    trigger: '日本央行意外收紧货币政策（加息或减少购债），叠加日元大幅升值，触发大规模日元套息交易平仓。',
    chain: [
      '日元升值超出套息交易的容忍阈值，杠杆头寸被迫平仓止损',
      '套息资金撤出高息资产，全球范围内风险资产被同步抛售',
      '流动性最好、杠杆最集中的资产（美股科技股、加密货币）首当其冲',
      '波动率飙升引发系统性去杠杆，短期流动性紧张，相关性趋近于1'
    ],
    impacts: [
      {asset:'日元', dir:'up', note:'平仓买盘驱动，短期急升'},
      {asset:'美元指数', dir:'down', note:'对日元被动走弱，对其他货币不一定'},
      {asset:'黄金', dir:'neutral', note:'避险与流动性抛售相互拉扯，初期常同跌'},
      {asset:'全球股市', dir:'down', note:'高杠杆、高估值资产跌幅最大'}
    ],
    insight:{type:'trap', label:'陷阱提示', text:'套息平仓引发的抛售是"流动性驱动"而非"基本面驱动"，往往在1-2周内出现技术性反弹，容易让人误判为趋势反转。真正需要跟踪的是套息交易的存量规模是否已经出清——可以通过CFTC日元非商业持仓数据侧面观察。'}
  },
  geopolitical: {
    label: '地缘政治冲击',
    driver: '地缘政治',
    lag: '即时 ~ 数周',
    trigger: '突发地缘冲突或局势升级（如中东、台海、俄乌相关事件），市场在信息不完整的情况下对尾部风险重新定价。',
    chain: [
      '避险情绪瞬间升温，资金从风险资产撤出，流向传统避险资产',
      '若事件涉及能源通道，油价首先反应，输入性通胀预期升温',
      '央行政策两难加剧——通胀压力与增长担忧同时出现，滞胀交易浮现',
      '若事件在数周内未升级，风险溢价逐步回吐，市场交易重新回归基本面'
    ],
    impacts: [
      {asset:'黄金', dir:'up', note:'经典避险资产，反应最快最直接'},
      {asset:'原油', dir:'up', note:'取决于事件是否涉及供给通道'},
      {asset:'美元/美债', dir:'up', note:'避险资金回流，短端需求上升'},
      {asset:'全球股市', dir:'down', note:'风险偏好回落，跌幅视事件烈度而定'}
    ],
    insight:{type:'ins', label:'非共识洞察', text:'历史数据显示，多数地缘冲击对股市的影响是"深V"而非趋势反转——标普500在多次地缘事件中平均在1-3周内收复失地，除非事件演变为供应链或能源的持续性中断。真正决定资产价格走势的不是事件本身，而是"事件是否会实质性改变现金流预期"。'}
  },
  inflation: {
    label: '通胀周期反复',
    driver: '经济周期',
    lag: '1 ~ 2季度',
    trigger: '通胀数据在下行趋势中意外反弹（如能源价格反弹、关税传导、工资黏性），打破"通胀已被控制"的市场共识。',
    chain: [
      'CPI/PCE数据超预期，市场重新计入更长时间维持高利率的概率',
      '降息预期被推迟或降息次数被下修，美债收益率曲线整体上移',
      '实际利率上行侵蚀无息资产吸引力，同时压制高估值成长股',
      '若通胀反弹伴随增长走弱，滞胀交易占优——大宗商品与防御股相对跑赢'
    ],
    impacts: [
      {asset:'美债收益率', dir:'up', note:'降息预期后移，长端跟随上行'},
      {asset:'美元指数', dir:'up', note:'"higher for longer"支撑利差'},
      {asset:'黄金', dir:'neutral', note:'抗通胀属性与实际利率上行相互对冲'},
      {asset:'成长股/纳指', dir:'down', note:'估值端最先承压'}
    ],
    insight:{type:'trap', label:'陷阱提示', text:'不要把单月通胀反弹直接等同于趋势反转。需要拆解结构：是能源等波动性分项驱动（噪音），还是核心服务/工资黏性驱动（趋势）。后者对政策路径的影响远大于前者，也是判断"是否需要重新定价降息节奏"的关键分界线。'}
  }
};

const order = ['fed_hike','fed_cut','yen_carry','geopolitical','inflation'];

// Build tabs
const tabsEl = document.getElementById('tabs');
order.forEach(key=>{
  const b = document.createElement('div');
  b.className = 'tab';
  b.textContent = scenarios[key].label;
  b.onclick = ()=>go(key);
  b.dataset.key = key;
  tabsEl.appendChild(b);
});

function dirLabel(d){
  if(d==='up') return '↑ 上行';
  if(d==='down') return '↓ 下行';
  return '— 分化';
}
function dirClass(d){
  return d==='up' ? 'dir-up' : (d==='down' ? 'dir-down' : 'dir-neutral');
}

function go(key){
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.key===key);
  });
  const s = scenarios[key];

  const chainHtml = s.chain.map((step,i)=>`
    <div class="chain-step">
      <div class="chain-num">${i+1}</div>
      <div class="chain-text">${step}</div>
    </div>`).join('');

  const impactsHtml = s.impacts.map(im=>`
    <div class="icard">
      <div class="icard-asset">${im.asset}</div>
      <div class="icard-dir ${dirClass(im.dir)}">${dirLabel(im.dir)}</div>
      <div class="icard-note">${im.note}</div>
    </div>`).join('');

  const insTypeClass = s.insight.type === 'trap' ? 'ins trap' : 'ins';
  const insColor = s.insight.type === 'trap' ? 'var(--text-warning)' : 'var(--text-accent)';

  document.getElementById('sc').innerHTML = `
    <div class="trigger-box">
      <div class="tag-row">
        <span class="tag-driver">${s.driver}</span>
        <span class="tag-lag">⏱ ${s.lag}</span>
      </div>
      <div class="trigger-text">${s.trigger}</div>
    </div>
    <div class="section-label">传导链条</div>
    <div class="chain">${chainHtml}</div>
    <div class="section-label">资产影响</div>
    <div class="igrid">${impactsHtml}</div>
    <div class="${insTypeClass}">
      <div class="ins-label" style="color:${insColor}">【${s.insight.label}】</div>
      <div class="ins-text">${s.insight.text}</div>
    </div>
  `;

  renderMatrix(key);
}

function matrixDir(key, asset){
  const s = scenarios[key];
  const map = {
    fed_hike:    {usd:'up', yield:'up', gold:'down', equity:'down'},
    fed_cut:     {usd:'down', yield:'down', gold:'up', equity:'up'},
    yen_carry:   {usd:'down', yield:'neutral', gold:'neutral', equity:'down'},
    geopolitical:{usd:'up', yield:'up', gold:'up', equity:'down'},
    inflation:   {usd:'up', yield:'up', gold:'neutral', equity:'down'}
  };
  return map[key][asset];
}

function renderMatrix(activeKey){
  const tbody = document.getElementById('matrix');
  tbody.innerHTML = order.map(key=>{
    const s = scenarios[key];
    const rowClass = key===activeKey ? 'matrix-row-active' : '';
    return `<tr class="${rowClass}">
      <td>${s.label}</td>
      <td class="${dirClass(matrixDir(key,'usd'))}">${dirLabel(matrixDir(key,'usd'))}</td>
      <td class="${dirClass(matrixDir(key,'yield'))}">${dirLabel(matrixDir(key,'yield'))}</td>
      <td class="${dirClass(matrixDir(key,'gold'))}">${dirLabel(matrixDir(key,'gold'))}</td>
      <td class="${dirClass(matrixDir(key,'equity'))}">${dirLabel(matrixDir(key,'equity'))}</td>
    </tr>`;
  }).join('');
}

go('fed_hike');
</script>
</body>
</html>

<svg width="200" height="280" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Main S spine, thick stroke to mimic stout/low-contrast bold serif letterform -->
  <path d="M 78,32
           C 78,16 63,6 44,6
           C 26,6 12,15 12,28
           C 12,39 20,45 38,51
           C 54,56 63,61 63,72
           C 63,85 50,94 33,94
           C 17,94 5,85 5,71"
        fill="none" stroke="#0078D4" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Terminal serif slabs at the two stroke ends, angled to suggest a stout bracketed serif -->
  <rect x="66" y="18" width="26" height="15" rx="4" fill="#0078D4" transform="rotate(18 79 25)"/>
  <rect x="0" y="66" width="26" height="15" rx="4" fill="#0078D4" transform="rotate(18 13 73)"/>
</svg>
